defaults:
  - dpt_dense_seg_langSam3Q8T_behav4_mO20_imgbal
  - _self_

# Smoke-test variant: tiny subsets so the full pipeline (dataset build,
# dense rasterization, model forward, dense loss, val passes, checkpoint
# save) finishes in a couple of minutes.
train_dataset:
  train_subsample_fraction: 0.001
  val_subsample_fraction: 0.01
  # Disable disk caching during smoke runs — keeps the working dir
  # clean and avoids interfering with real cached runs.
  dense_cache_enabled: false

trainer:
  loop:
    max_epochs: 2
    save_every_n_epochs: 1
    use_wandb: false
    val_max_batches: 4
    train_eval_max_batches: 4
    batch_size: 4
    val_batch_size: 8
    num_workers: 2
    val_num_workers: 2
