defaults:
  - registry_info: registry_default
  - benchmark_dataset: annotation_tool_pucpr
  - inferencer: direct_vlm_query
  - predictor: direct_vlm_gemma
  - benchmark: pucpr_images
  - eval_scenario: percentile_horizons
  - analysis: basic
  - _self_

mode: run_all

paths:
  output_root: /workspace/data/output/persistence_eval_outputs/
  explicit_inference_run_dir: null

runtime:
  device: cuda
  threshold: 0.5
  timestamp: null

# Gemma direct-future-existence querier overrides:
# - Three-image request matching the prefix file layout:
#   (1) full-size with cyan-outlined object on blurred background,
#   (2) zoomed crop with the same mask styling, and
#   (3) the unmodified full scene last.
predictor:
  querier:
    prefix_file: "prompt_files/instance_describer/format_prefix/pref_bgBlur_crop_with_mask_full_no_hole.txt"
    mask_style: blur_bg_outline_fg
    mask_highlight_color: [0, 255, 255]   # cyan, matches the prefix wording
    mask_dilation_px: 5
    blur_radius: 8
    mask_background_dim_factor: 0.35
    mask_outline_thickness: 1
    highlight_alpha: 0.0
    include_zoomed_crop: true
    mask_crop: true
    include_full_img_last: true
    include_box_image: false
    include_arrow_image: false
    include_context_crop: false
