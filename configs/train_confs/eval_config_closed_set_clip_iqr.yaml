defaults:
  - registry_info: registry_default
  - benchmark_dataset: annotation_tool_pucpr
  - inferencer: closed_set_clip
  - survival_generator: weibull
  - persistence_filter: rosen
  - predictor: survival_based
  - benchmark: pucpr_images
  - eval_scenario: dynamic_anchor_only
  - analysis: basic
  - _self_

mode: run_all    # infer | evaluate | run_all

paths:
  output_root: /workspace/data/output/persistence_eval_outputs/
  explicit_inference_run_dir: null

runtime:
  device: cuda
  threshold: 0.5
  timestamp: null

inferencer:
  name: closed_set_clip_coco_stuff_iqr
  semanticClassPersistenceParamLookup:
    params_file: "cached_closed_set_info/closed_set_persistence_params_cache/coco-stuff-p25-p75.json"

survival_generator:
  low_key: p25
  high_key: p75
  time_scale_factor: 3600.0