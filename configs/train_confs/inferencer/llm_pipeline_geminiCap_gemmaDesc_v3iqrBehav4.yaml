# @package inferencer
# Sibling of llm_pipeline_gemma_capLong7_descBlurMask_v3iqrBehav4.yaml that
# swaps the Gemma VLM scene captioner for a Gemini-2.5-pro one. Object
# describer and persistence querier still run through the local Gemma vLLM
# server (port 9008).
defaults:
  - /inferencer/sceneCaptioner: gemini_cap_2_5_pro_proc_long7
  - /inferencer/objectDescriber: gemma_vlm_object_describer_blur_bg_context_crop_mask_long
  - /inferencer/llmPersistenceQuerier: chained_text_gemma4_v3iqr_behav4_mO20

_target_: persistence_eval.methods.inferencers.llm_pipeline.LLMPipelineInferencer
param_keys: [p25_persistence_hours, p75_persistence_hours]
debug_log: false
debug_visualizations: true
