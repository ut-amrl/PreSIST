# @package inferencer.llmPersistenceQuerier
# Persistence querier whose LLM backend is Gemini-2.5-pro. The prompt handler
# (v3_iqr_behav4) is unchanged from the Gemma version — its parser is
# engine-agnostic and copes with Gemini's markdown-fenced JSON output.
defaults:
  - llmQuerier: gemini_2_5_pro_llm
  - promptHandler: v3_iqr_behav4

_target_: dataset_generation.llm_persistence_querying.chained_prompt_query_persistence_querier.ChainedPromptQueryPersistenceQuerier
useSpatialGrouping: true
maxObjsPerQuery: 20
missingIdRetryAttempts: 2
