# @package inferencer.llmPersistenceQuerier
defaults:
  - llmQuerier: gemma4_31b_llm
  - promptHandler: v3_iqr_behav4

_target_: dataset_generation.llm_persistence_querying.chained_prompt_query_persistence_querier.ChainedPromptQueryPersistenceQuerier
useSpatialGrouping: true
maxObjsPerQuery: 20
# Re-query just the missing seg-ids when the LLM silently drops some.
# After the initial pass, attempt up to this many narrower follow-up
# queries. If a follow-up makes zero progress on a multi-id set, the
# querier additionally splits it in half and tries each half once
# (counts as a single retry attempt overall).
missingIdRetryAttempts: 2
