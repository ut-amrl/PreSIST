defaults:
  - cross_attn_seg_langSam3Q8T_behav4_mO20_imgbal_lowlr_huber
  - _self_

# Balanced-weights variant of the lowlr+huber recipe.
#
# Empirical training-set variances from scripts/compute_label_stats.py:
#   Var(y50) ≈ 26.64   →  1/Var ≈ 0.0375
#   Var(yr)  ≈ 0.7627  →  1/Var ≈ 1.3112
#   Var(y50)/Var(yr)   ≈ 35×  (this is why L50 dominated before)
#
# With the 1/Var heuristic each task contributes ~1 unit of MSE in
# expectation at random init, so the gradient direction is no longer
# biased toward y50. Confidence weight left at 0.5 — yc is already on
# a small scale (Var ≈ 0.015) and is mostly fine.
#
# Together with Huber (inherited) the head should see well-conditioned,
# bounded gradients on all three tasks. Expect:
#   - Total loss starts much smaller (~1-2, not ~5-7).
#   - L50 component starts near 1 instead of near 5.
#   - Lr starts near 1 instead of near 0.3 (because it's weighted up).
#   - GN average should drop further than _lowlr_huber's ~17.
trainer:
  name: lowlr_huber_balw
  loss_function:
    w50: 0.0375
    wr: 1.3112
    wc: 0.5
