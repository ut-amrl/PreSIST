# @package eval_scenario
# Anchor-window variant with a 30-minute recency cap (default sibling to the
# scaled / windowed defaults). Each query at dt_q from anchor sees
# observations with timestamps in `[anchor, anchor + min(1800, dt_q/2)]`.
# Saturates at `[anchor, anchor + 1800 s]` for dt_q ≥ 3600 s.
#
# Differs from `percentile_scaled_horizons` in window placement: the visible
# window is anchored at the filter's start, not walked back from t_q.
#
# Eval outputs land under `survival_based__percentile_anchor_window_horizons/`.
_target_: persistence_eval.sampling.percentile_anchor_window_horizon_episode_provider.PercentileAnchorWindowHorizonEpisodeProvider
name: percentile_anchor_window_horizons
percentile: 90.0
num_query_times: 20
spacing: power
power_exponent: 2.0
t_min: 1.0
max_query_inflation: 1.0
recency_cap: 1800.0     # 30 minutes
require_disappearance_observed: false
