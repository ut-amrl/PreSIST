defaults:
  - registry_info: registry_default
  - benchmark_dataset: annotation_tool_pucpr_split_50_20_30_test_balanced
  - inferencer: llm_pipeline_gemma_capLong7_descBlurMask_v3iqrBehav4
  - survival_generator: weibull_pucpr_llm
  - persistence_filter: rosen
  - predictor: survival_based
  - benchmark: pucpr_images
  - eval_scenario: percentile_horizons
  - analysis: basic
  - _self_

# LLM is inference-only (no per-cell retraining), so this cfg is NOT part of
# the day-count sweep. It exists solely to point the existing LLM pipeline at
# the new 50/20/30 test split. Run with:
#   python eval_persistence.py \
#     --config-name=eval_config_llm_pucpr_split_50_20_30_gemma_v3iqrBehav4_mO20_percentile_balanced

mode: run_all

experiment:
  name: llm_pipeline_gemma_v3iqrBehav4_mO20_pucpr_split_50_20_30
  subsample_fraction: 1.0
  subsample_seed: 0

paths:
  output_root: /workspace/data/output/persistence_eval_outputs/
  explicit_inference_run_dir: null

runtime:
  device: cuda
  threshold: 0.5
  timestamp: null
  seed: null

# Matched-noise default (p_m = p_f = 0.01) for the headline sweeps. Overrides
# the filter YAML's 0.05 / 0.1 defaults. The script-level EVAL_NOISE_PM / PF
# env knobs still take precedence when explicitly set.
persistence_filter:
  missed_detection_prob: 0.01
  false_detection_prob: 0.01
