# Mirrors whatever train_dataset is currently selected — no per-dataset file needed.
# Use this as the default eval_dataset when evaluating on the same dataset used for training.
# Override individual fields below if eval should differ (e.g., a different split_json).
name: ${train_dataset.name}
_target_: ${train_dataset._target_}
input_root_dir: ${train_dataset.input_root_dir}
output_root_dir: ${train_dataset.output_root_dir}
segmentation_config_name: ${train_dataset.segmentation_config_name}
full_results_config_name: ${train_dataset.full_results_config_name}
split_id_kind: ${train_dataset.split_id_kind}
split_granularity: ${train_dataset.split_granularity}
split_json: ${oc.select:train_dataset.split_json,null}
split_dir: ${oc.select:train_dataset.split_dir,null}
train_split_file: ${oc.select:train_dataset.train_split_file,null}
val_split_file: ${oc.select:train_dataset.val_split_file,null}
test_split_file: ${oc.select:train_dataset.test_split_file,null}
label_transform: ${oc.select:train_dataset.label_transform,null}
val_max_instances_per_image: ${oc.select:train_dataset.val_max_instances_per_image,null}
