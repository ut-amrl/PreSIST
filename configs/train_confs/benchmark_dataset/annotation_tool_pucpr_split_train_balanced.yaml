# @package benchmark_dataset
# Per-track-balanced eval-on-train (diagnostic) benchmark. Same per-track
# sampling rules as annotation_tool_pucpr_split_test_balanced.yaml, but
# points at the 50/50 split's TRAIN manifest. Used to expose train-vs-test
# metric gap as a function of subsample fraction.
name: pucpr_split_new_pklot_PUCPR_train_50_50_balanced
_target_: persistence_eval.datasets.annotation_tool.AnnotationToolBackingDataset
manifest_path: /workspace/data/input/new_pklot/postprocessed/annotations/PUCPR_repaired_split_flanks_fixed/splits/50_50/train_through_2012-10-15.json
max_anchor_observations: 1000
shuffle_seed: 42
per_track_balanced: true
host_root: /robodata/aaadkins/Datasets/semPersFilter/evalCandidates/new_pklot
container_root: /workspace/data/input/new_pklot

image_mask_view:
  _target_: persistence_eval.datasets.annotation_tool.AnnotationToolImageMaskView

track_view:
  _target_: persistence_eval.datasets.annotation_tool.AnnotationToolTrackView
