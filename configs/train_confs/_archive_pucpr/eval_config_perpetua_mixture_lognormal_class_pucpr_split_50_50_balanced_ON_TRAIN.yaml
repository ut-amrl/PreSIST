defaults:
  - registry_info: registry_default
  - benchmark_dataset: annotation_tool_pucpr_split_train_balanced
  - inferencer: class_keyed_lookup
  - survival_generator: mixture_lognormal
  - persistence_filter: rosen
  - predictor: survival_based
  - benchmark: pucpr_images
  - eval_scenario: dynamic_anchor_only
  - analysis: basic
  - _self_

mode: run_all

# Diagnostic: eval the trained Perpetua checkpoints on the TRAIN manifest.
# Same experiment.name as the test-side eval, so identical model_dir is
# loaded; the balanced TRAIN benchmark has a distinct `name:` so outputs
# land in their own dataset subdir under persistence_eval_outputs/.
experiment:
  name: perpetua_mixture_lognormal_class_pucpr_split_50_50
  subsample_fraction: 1.0
  subsample_seed: 0

paths:
  output_root: /workspace/data/output/persistence_eval_outputs/
  model_root: /workspace/data/output/perpetua/
  model_dir: ${paths.model_root}/${experiment.name}/frac${dot_to_p:${experiment.subsample_fraction}}_seed${experiment.subsample_seed}
  explicit_inference_run_dir: null

runtime:
  device: cuda
  threshold: 0.5
  timestamp: null

inferencer:
  name: ${experiment.name}_frac${dot_to_p:${experiment.subsample_fraction}}_seed${experiment.subsample_seed}
