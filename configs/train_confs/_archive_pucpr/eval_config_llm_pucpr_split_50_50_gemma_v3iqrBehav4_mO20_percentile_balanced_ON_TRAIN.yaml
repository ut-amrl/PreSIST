defaults:
  - registry_info: registry_default
  - benchmark_dataset: annotation_tool_pucpr_split_train_balanced
  - inferencer: llm_pipeline_gemma_capLong7_descBlurMask_v3iqrBehav4
  - survival_generator: weibull_pucpr_llm
  - persistence_filter: rosen
  - predictor: survival_based
  - benchmark: pucpr_images
  - eval_scenario: percentile_horizons
  - analysis: basic
  - _self_

mode: run_all

# Diagnostic: same Gemma pipeline as the test-side eval, evaluated on the
# TRAIN manifest. Gemma is not learned so this isn't measuring overfitting
# per se, but it exposes whether the prompt/pipeline behaves consistently
# across the two temporal halves -- a fairness baseline against the
# vision/Perpetua train-vs-test gaps. The balanced TRAIN benchmark has a
# distinct `name:` so outputs land in their own dataset subdir.
experiment:
  name: llm_pipeline_gemma_v3iqrBehav4_mO20_pucpr_split_50_50
  subsample_fraction: 1.0
  subsample_seed: 0

paths:
  output_root: /workspace/data/output/persistence_eval_outputs/
  explicit_inference_run_dir: null

runtime:
  device: cuda
  threshold: 0.5
  timestamp: null
  seed: null
