defaults:
  - registry_info: registry_default
  - benchmark_dataset: annotation_tool_pucpr
  - inferencer: llm_pipeline_qwen3_vllm_qvlm_desc
  - survival_generator: weibull_pucpr_llm
  - persistence_filter: rosen
  - benchmark: pucpr_images
  - eval_scenario: dynamic_anchor_only
  - analysis: basic
  - _self_

mode: run_all

paths:
  output_root: /workspace/data/output/persistence_eval_outputs/
  explicit_inference_run_dir: null

runtime:
  device: cuda
  threshold: 0.5
  timestamp: null
  seed: null

inferencer:
  objectDescriber:
    name: qwenVLMDescCausalDumb
    # prompt_file: "prompt_files/instance_describer/isthisspot.txt"
    prompt: "Make sure to locate the target object in the full image. Is this car in a parking spot? Explain why or why not based on visual cues. If there are particular visual cues you are looking for, please state exactly where they are. "
    prefix_file: "prompt_files/instance_describer/qwen_double_image_preamble2.txt"
    mask_dilation_px: 30


