# Sibling of eval_config_direct_vlm_gemma4_v1_iqr_behav4_robotcar_loc01_test.yaml
# but bypasses the persistence filter entirely: instead of inferring p25/p75
# IQR parameters and feeding them through a survival-based predictor, this
# config asks Gemma directly "will this object be present at horizon T?" for
# each query horizon (one VLM call per horizon, parallelised via chat_many).
#
# Pairs `inferencer: direct_vlm_query` with `predictor: direct_vlm_gemma_per_horizon`.
# The inferencer just caches per-track image+mask references; all prediction
# happens inside the per-horizon Gemma querier.
#
# Run with:
#   python eval_persistence.py --config-name=eval_config_direct_vlm_query_gemma_per_horizon_robotcar_loc01_test

defaults:
  - registry_info: registry_default
  - benchmark_dataset: annotation_tool_robotcar_loc01_test
  - inferencer: direct_vlm_query
  - predictor: direct_vlm_gemma_per_horizon
  - benchmark: persistence_filter
  - eval_scenario: percentile_horizons
  - analysis: basic
  - _self_

mode: run_all

experiment:
  method: direct_vlm_query_gemma_per_horizon
  benchmark_dataset: ${benchmark_dataset.name}
  name: ${experiment.method}__${experiment.benchmark_dataset}

paths:
  output_root: /workspace/data/output/persistence_eval_outputs/
  explicit_inference_run_dir: null

runtime:
  device: cuda
  threshold: 0.5
  timestamp: null
  seed: null
