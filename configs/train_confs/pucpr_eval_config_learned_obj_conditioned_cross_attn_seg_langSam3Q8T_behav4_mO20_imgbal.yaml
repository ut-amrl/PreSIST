defaults:
  - registry_info: registry_default
  - benchmark_dataset: annotation_tool_pucpr_split_50_20_30_test_balanced
  - inferencer: learned_model    # composes /model: obj_conditioned_cross_attn + /mask_pooler@pooler: masked_mean
  - survival_generator: weibull_pucpr_llm
  - persistence_filter: rosen
  - predictor: survival_based
  - benchmark: pucpr_images
  - eval_scenario: percentile_horizons
  - analysis: basic
  - _self_

# Points the learned cross-attention model trained by
#   CUDA_VISIBLE_DEVICES=1 python3 train.py \
#     --config-name=cross_attn_seg_langSam3Q8T_behav4_mO20_imgbal
# at the PUCPR 50/20/30 test split. Mirrors the structure of the LLM
# baseline config so headline numbers stay apples-to-apples.
#
# Run with:
#   python infer_persistence.py \
#     --config-name=pucpr_eval_config_learned_obj_conditioned_cross_attn_seg_langSam3Q8T_behav4_mO20_imgbal

mode: run_all

experiment:
  name: learned_obj_conditioned_cross_attn_seg_langSam3Q8T_behav4_mO20_imgbal_pucpr_split_50_20_30
  subsample_fraction: 1.0
  subsample_seed: 0

paths:
  output_root: /workspace/data/output/persistence_eval_outputs/
  explicit_inference_run_dir: null

runtime:
  device: cuda
  threshold: 0.5
  timestamp: null
  seed: null

# Matched-noise default (p_m = p_f = 0.01), matching the headline LLM sweeps.
persistence_filter:
  missed_detection_prob: 0.01
  false_detection_prob: 0.01

inferencer:
  # Drives the per-method output folder
  # (persistence_eval_outputs/<dataset>/<name>/<benchmark>/inference_runs/<ts>);
  # without this, every learned-model run lands under "LearnedModelInferencer"
  # regardless of checkpoint and collides.
  name: learned_obj_conditioned_cross_attn__seg_langSam3Q8T_behav4_mO20_imgbal__ckpt_epoch_0_pretrain
  checkpoint_path: /workspace/data/output/training_outputs/seg_langSam3Q8T_behav4_mO20_imgbal/obj_conditioned_cross_attn__mask_downsample/default/2026-05-20_06-52-08/checkpoints/ckpt_epoch_0_pretrain.pth
