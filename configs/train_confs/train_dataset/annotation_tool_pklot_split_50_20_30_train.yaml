# @package train_dataset
#
# Train manifest preset for Perpetua-style trainers against the 50/20/30
# temporal split of PUCPR_repaired_split_flanks_fixed (generated by
# generate_temporal_split.py --train-fraction 0.5 --val-fraction 0.2).
#
# Day-count sweeps override `manifest_path` to point at one of the
# splits/50_20_30/daycount/days_NNNN/train_first_*.json files. The
# `external_val_manifest_path` below is consumed by the orchestrator
# (training_orchestrator.py); when set, TrainingDataset loads val tracks
# from this manifest instead of slicing them off train, which matters at
# small N where the train pool is too small to slice safely.

name: pklot_pucpr_split_train_50_20_30
manifest_path: /workspace/data/input/new_pklot/postprocessed/annotations/PUCPR_repaired_split_flanks_fixed/splits/50_20_30/train_through_2012-10-15.json
external_val_manifest_path: /workspace/data/input/new_pklot/postprocessed/annotations/PUCPR_repaired_split_flanks_fixed/splits/50_20_30/val_from_2012-10-16_through_2012-10-29.json
cell_size_px: 128
class_id: 0
host_root: /robodata/aaadkins/Datasets/semPersFilter/evalCandidates/new_pklot
container_root: /workspace/data/input/new_pklot
