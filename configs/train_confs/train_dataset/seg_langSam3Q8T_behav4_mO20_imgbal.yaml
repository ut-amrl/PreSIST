# Cap instances per image for the val split to keep val passes fast on
# images with many masks (median 29, max ~175). The image-weighted
# validation metric (via sample_weight = 1/n_after_cap) keeps per-image
# contributions uniform regardless of the cap.
val_max_instances_per_image: 25

# New persistence results use p25/p75 percentile fields instead of p50/p90.
# This transform reads p25/p75/conf and emits (log p25, log IQR-ratio, conf).
