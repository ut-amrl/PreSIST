defaults:
  - loss_function: weighted_multi_loss
  - lr_scheduler: cosine_epoch
  - optimizer: adamw
  - _self_

name: default

loop:
  _target_: training.trainer.TrainerConfig
  max_epochs: 100
  log_every_n_batches: 10
  save_every_n_epochs: 10
  early_stopping_patience: 10
  use_amp: False
  grad_clip_norm: 1.0
  use_wandb: True
  device: null
  batch_size: 8
  wandb_entity: ut-amrl-amanda
  wandb_project: semantic-persistence-filter
  validationConfig:
    _target_: training.validator.ValConfig
    confidence_from_logits: ${trainer.loss_function.confidence_from_logits}
  img_size: 518
