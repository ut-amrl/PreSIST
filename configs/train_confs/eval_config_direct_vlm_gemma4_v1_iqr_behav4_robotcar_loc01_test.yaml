# Sibling of eval_config_llm_pipeline_gemma_capLong7_descBlurMask_v3iqrBehav4_robotcar_loc01_test.yaml
# but uses the single-phase direct-VLM inferencer: one Gemma VLM call per object
# that returns strict-JSON IQR persistence parameters, skipping the scene-caption
# and object-description stages.
#
# Run with:
#   python eval_persistence.py --config-name=eval_config_direct_vlm_gemma4_v1_iqr_behav4_robotcar_loc01_test

defaults:
  - registry_info: registry_default
  - benchmark_dataset: annotation_tool_robotcar_loc01_test
  - inferencer: direct_vlm_pipeline_gemma4_v1_iqr_behav4
  - survival_generator: weibull_pucpr_llm
  - persistence_filter: rosen
  - predictor: survival_based
  - benchmark: persistence_filter
  - eval_scenario: percentile_horizons
  - analysis: basic
  - _self_

mode: run_all

experiment:
  method: direct_vlm_gemma4_v1_iqr_behav4
  benchmark_dataset: ${benchmark_dataset.name}
  name: ${experiment.method}__${experiment.benchmark_dataset}

paths:
  output_root: /workspace/data/output/persistence_eval_outputs/
  explicit_inference_run_dir: null

runtime:
  device: cuda
  threshold: 0.5
  timestamp: null
  seed: null

# Matched-noise default (p_m = p_f = 0.01) for the headline sweeps. Overrides
# the filter YAML's 0.05 / 0.1 defaults. The script-level EVAL_NOISE_PM / PF
# env knobs still take precedence when explicitly set.
persistence_filter:
  missed_detection_prob: 0.01
  false_detection_prob: 0.01
