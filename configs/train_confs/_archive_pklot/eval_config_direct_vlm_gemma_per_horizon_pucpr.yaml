defaults:
  - registry_info: registry_default
  - benchmark_dataset: annotation_tool_pucpr
  - inferencer: direct_vlm_query
  - predictor: direct_vlm_gemma_per_horizon
  - benchmark: pucpr_images
  - eval_scenario: dynamic_anchor_only
  - analysis: basic
  - _self_

# Same inferencer + dataset as eval_config_direct_vlm_gemma_pucpr.yaml — the
# inference run dir is shared (artifacts are identical: cached image_path +
# mask_path). Eval outputs split because predictor `name:` differs:
#   .../direct_vlm_query/<bench>/inference_runs/<ts>/evaluation_runs/
#       direct_vlm_gemma_per_horizon__dynamic_anchor_only/<ts>/

mode: run_all

paths:
  output_root: /workspace/data/output/persistence_eval_outputs/
  explicit_inference_run_dir: null

runtime:
  device: cuda
  threshold: 0.5
  timestamp: null

# Per-horizon Gemma querier overrides — same overlay setup as the all-horizons
# variant so the prefix file's three-image layout still applies.
predictor:
  querier:
    prefix_file: "prompt_files/instance_describer/format_prefix/pref_bgBlur_crop_with_mask_full_no_hole.txt"
    mask_style: blur_bg_outline_fg
    mask_highlight_color: [0, 255, 255]   # cyan, matches the prefix wording
    mask_dilation_px: 5
    blur_radius: 8
    mask_background_dim_factor: 0.35
    mask_outline_thickness: 1
    highlight_alpha: 0.0
    include_zoomed_crop: true
    mask_crop: true
    include_full_img_last: true
    include_box_image: false
    include_arrow_image: false
    include_context_crop: false
    # Per-horizon-specific knob — fan-out across query times.
    max_concurrency: 16
