defaults:
  - registry_info: registry_default
  - benchmark_dataset: annotation_tool_pucpr_repaired_split_test_balanced
  - inferencer: vision_anchor_midpoint
  - model: vision_scalar_predictor
  - survival_generator: single_exp
  - persistence_filter: rosen
  - predictor: survival_based
  - benchmark: pucpr_images
  - eval_scenario: percentile_horizons
  - analysis: basic
  - _self_

mode: run_all

# Mirror eval_config_vision_anchor_midpoint_pucpr_repaired_split_50_50.yaml,
# but swap benchmark_dataset for the per-track-balanced variant. experiment.name
# is identical so we reuse the same trained checkpoints; only the eval-side
# output dataset subdir changes (driven by benchmark_dataset.name).
experiment:
  name: vision_anchor_midpoint_pucpr_repaired_split_50_50
  subsample_fraction: 1.0
  subsample_seed: 0

paths:
  output_root: /workspace/data/output/persistence_eval_outputs/
  model_root: /workspace/data/output/perpetua/
  model_dir: ${paths.model_root}/${experiment.name}/frac${experiment.subsample_fraction}_seed${experiment.subsample_seed}
  explicit_inference_run_dir: null

runtime:
  device: cuda
  threshold: 0.5
  timestamp: null

inferencer:
  name: ${experiment.name}_frac${experiment.subsample_fraction}_seed${experiment.subsample_seed}
