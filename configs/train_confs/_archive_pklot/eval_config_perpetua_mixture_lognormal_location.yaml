defaults:
  - registry_info: registry_default
  - benchmark_dataset: annotation_tool_pucpr_repaired_test
  - inferencer: location_keyed_lookup
  - survival_generator: mixture_lognormal
  - persistence_filter: mixture_persistence_filter
  - predictor: survival_based
  - benchmark: pucpr_images
  - eval_scenario: dynamic_anchor_only
  - analysis: basic
  - _self_

mode: run_all

experiment:
  name: perpetua_mixture_lognormal_location
  subsample_fraction: 1.0
  subsample_seed: 0

paths:
  # Standard eval output location, matching the rest of the codebase.
  output_root: /workspace/data/output/persistence_eval_outputs/
  # Trained Perpetua model lives under model_root/<experiment.name>/frac<F>_seed<S>/.
  model_root: /workspace/data/output/perpetua/
  model_dir: ${paths.model_root}/${experiment.name}/frac${dot_to_p:${experiment.subsample_fraction}}_seed${experiment.subsample_seed}
  explicit_inference_run_dir: null

runtime:
  device: cuda
  threshold: 0.5
  timestamp: null

# Embed (training-fraction, seed) into the method-level subdir name. The
# orchestrator uses inferencer.name as `method_name` when building the
# eval output path (resolve_output_layout), so renaming it here makes
# every eval run for one cell live under a single
#   <output_root>/<dataset>/<experiment.name>_frac<F>_seed<S>/<benchmark>/...
# subtree.
inferencer:
  name: ${experiment.name}_frac${dot_to_p:${experiment.subsample_fraction}}_seed${experiment.subsample_seed}
