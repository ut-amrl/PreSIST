# @package model

defaults:
  - cross_attn_pooler: mask_downsample_soft
  - _self_

_target_: persistence_parameter_networks.models.persistence_output_predictors.PersistenceObjConditionedCrossAttn

# -------------------------
# Backbone config
# -------------------------
backbone_cfg:
  _target_: persistence_parameter_networks.models.img_encoders.selavpr.rich_img_encoder.RichOutputSelaEncoderArgs

  foundation_model_path: "pretrained_models/dinov2_vitl14_pretrain.pth"
  registers: false
  resume: false
  image_size: 518

  freeze_dino: true
  use_adapter: true
  pretrained_adapter_path: null
  freeze_pre_sela: false
  use_local: False # Needs to be true if using local map pooler

attn_dim: null
num_heads: 8
ff_hidden: 512
confidenceFromLogits: false

# If struggling with small objects, try switching to dilated_token (first), feature_upsample (second) or local_map pooler (second)