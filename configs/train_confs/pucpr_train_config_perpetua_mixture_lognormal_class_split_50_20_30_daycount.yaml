defaults:
  - trainer: persistence_fit_mixture_lognormal
  - train_dataset: annotation_tool_pklot_split_50_20_30_train
  - _self_

# Paired counterpart: eval_config_perpetua_mixture_lognormal_class_pucpr_split_50_20_30_daycount_balanced.yaml
# experiment.day_count is mandatory and is supplied by the day-count sweep
# wrapper (scripts/sweep_train_eval_pucpr_split_50_20_30_daycount_balanced.sh).

grouping: class

experiment:
  name: perpetua_mixture_lognormal_${grouping}_pucpr_split_50_20_30_daycount
  day_count: ???
  subsample_fraction: 1.0
  subsample_seed: 0

paths:
  model_root: /workspace/data/output/perpetua/
  model_dir: ${paths.model_root}/${experiment.name}/days${experiment.day_count}_seed${experiment.subsample_seed}

runtime:
  seed: ${experiment.subsample_seed}
