# Sibling of eval_config_closed_set_clip_p25_p75_hd_epic_P01_test.yaml — same
# dataset, sampler, filter, and analysis stage; swaps the closed-set CLIP +
# coco-stuff lookup for a learned obj-conditioned cross-attention model
# checkpoint. Outputs p25/p75 persistence hours per the seg_langSam3Q8T_behav4
# training family, fed into the matching Weibull generator.
#
# Run with:
#   python eval_persistence.py --config-name=eval_config_learned_obj_conditioned_cross_attn_lowlr_huber_norm_hd_epic_P01_test

defaults:
  - registry_info: registry_default
  - benchmark_dataset: annotation_tool_hd_epic_P01_test
  - inferencer: learned_model    # composes /model: obj_conditioned_cross_attn + /mask_pooler@pooler: masked_mean
  - survival_generator: weibull_pucpr_llm
  - persistence_filter: rosen
  - predictor: survival_based
  - benchmark: persistence_filter
  - eval_scenario: percentile_horizons
  - analysis: basic
  - _self_

mode: run_all    # infer | evaluate | run_all

experiment:
  method: learned_obj_conditioned_cross_attn__seg_langSam3Q8T_behav4_mO20_imgbal__lowlr_huber_norm__ckpt_best
  benchmark_dataset: ${benchmark_dataset.name}
  name: ${experiment.method}__${experiment.benchmark_dataset}

paths:
  output_root: /workspace/data/output/persistence_eval_outputs/
  explicit_inference_run_dir: null

runtime:
  device: cuda
  threshold: 0.5
  timestamp: null
  seed: null

inferencer:
  # Drives the per-method output dir; without this every learned-model run
  # lands under "LearnedModelInferencer" regardless of checkpoint and collides.
  name: ${experiment.method}
  checkpoint_path: /workspace/data/output/training_outputs/seg_langSam3Q8T_behav4_mO20_imgbal/obj_conditioned_cross_attn__mask_downsample/lowlr_huber_norm/2026-05-21_09-09-28/checkpoints/ckpt_best.pth
