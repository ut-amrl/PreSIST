defaults:
  - trainer: vision_anchor_midpoint_balanced
  - model: vision_scalar_predictor
  - train_dataset: annotation_tool_pklot_split_train_vision
  - _self_

grouping: class

# experiment.name distinguishes balanced-train checkpoints from any future
# non-balanced variant and from the archived pucpr_repaired_split runs.
experiment:
  name: vision_anchor_midpoint_pucpr_split_50_50_balanced_train
  subsample_fraction: 1.0
  subsample_seed: 0
  val_track_fraction: 0.1
  val_split_seed: 0

paths:
  model_root: /workspace/data/output/perpetua/
  model_dir: ${paths.model_root}/${experiment.name}/frac${experiment.subsample_fraction}_seed${experiment.subsample_seed}

runtime:
  seed: ${experiment.subsample_seed}
