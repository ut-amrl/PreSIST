# A4: dense + full mask-side recipe port.
#   = base dense + z-score target norm + Huber on log channels (loose50
#     delta_50=3.0, delta_r=1.0) + lr=1e-5 + per-instance aux loss.
#
# This is the headline candidate for matching the mask-based model on the
# same dataset. Compare against:
#   - dpt_dense_..._imgbal_aux.yaml (current best dense)
#   - cross_attn_..._lowlr_huber_norm_loose50.yaml (current best mask)
#
# Sub-variants:
#   _noaux: same recipe with the per-instance aux loss stripped (A5).

defaults:
  - train_dataset: seg_langSam3Q8T_behav4_mO20_imgbal_dense_norm
  - eval_dataset: mirror_train
  - model: dpt_dense_predictor
  - registry_info: registry_default
  - trainer: default
  - _self_
  - override /trainer/loss_function: dense_weighted_multi_loss_with_aux_huber


model_output_root_dir: "/workspace/data/output/training_outputs/"

trainer:
  # Distinct trainer name so the output dir + W&B run name don't collide
  # with the vanilla dense run (same dataset/model otherwise). Path slot:
  # <root>/<dataset>/<model>/<trainer.name>/<timestamp>/
  name: dense_lowlr_huber_norm_loose50
  optimizer:
    lr: 1e-5
  loop:
    image_balanced_sampling: false
    batch_size: 16
    val_batch_size: 32
    num_workers: 8
    val_num_workers: 12
    val_max_batches: 500
    train_eval_max_batches: 500
    train_samples_per_epoch: null
    validationConfig:
      confidence_from_logits: false
